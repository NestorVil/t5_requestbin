# Local rehearsal config — mimics the EC2 nginx setup on your laptop.
# Difference vs production: proxy_pass targets host.docker.internal (the way
# a container reaches the host on Docker Desktop). On the EC2 box, nginx and
# the Node backend run on the same host, so there it's 127.0.0.1:3000.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the built React app; fall back to index.html so client-side
    # routing (/web, /web/:basketName) works on refresh.
    location / {
        try_files $uri /index.html;
    }

    # REST API -> backend
    location /api/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Live updates (Socket.io) -> backend, with the headers a WebSocket
    # upgrade needs.
    location /socket.io/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Webhook capture endpoint -> backend
    location /basket/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
