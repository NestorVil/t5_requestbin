# Production nginx config for the EC2 box.
# Install to: /etc/nginx/conf.d/requestbin.conf
# Requires the stock "server { }" block in /etc/nginx/nginx.conf to be
# commented out (see DEPLOY.md), otherwise nginx errors on "duplicate
# default server".

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/requestbin;
    index index.html;

    # Built React app; fall back to index.html so /web and /web/:basketName
    # resolve on a hard refresh.
    location / {
        try_files $uri /index.html;
    }

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io live updates (WebSocket upgrade)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Webhook capture endpoint
    location /basket/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
