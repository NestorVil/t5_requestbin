# Web-tier nginx config for the 4-instance deployment.
# Install to: /etc/nginx/conf.d/requestbin.conf
# Requires the stock "server { }" block in /etc/nginx/nginx.conf to be
# commented out (see DEPLOY-4tier.md), otherwise nginx errors on
# "duplicate default server".
#
# Only difference from deploy/nginx-requestbin.conf (single-box): proxy_pass
# targets the app server's private IP instead of 127.0.0.1.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/requestbin;
    index index.html;

    # Built React app; SPA fallback so /web and /web/:basketName resolve on
    # a hard refresh.
    location / {
        try_files $uri /index.html;
    }

    # REST API -> app server
    location /api/ {
        proxy_pass http://10.0.0.132:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io live updates (WebSocket upgrade) -> app server
    location /socket.io/ {
        proxy_pass http://10.0.0.132:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Webhook capture endpoint -> app server
    location /basket/ {
        proxy_pass http://10.0.0.132:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
