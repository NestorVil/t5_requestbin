# Local dev databases. Start with:  docker compose up -d
# (needs Docker Desktop running)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: requestbin
      POSTGRES_PASSWORD: requestbin
      POSTGRES_DB: requestbin
    ports:
      # host 5433 to avoid clashing with a local Postgres on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U requestbin"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata:
  mongodata:
